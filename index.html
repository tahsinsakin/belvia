<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="BudVia" />
<meta name="theme-color" content="#1e3a5f" />
<meta name="referrer" content="no-referrer" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://unpkg.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://*.basemaps.cartocdn.com; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://unpkg.com https://tessdata.projectnaptha.com; font-src 'self' https://fonts.gstatic.com; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" />
<title>BudVia</title>
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pirata+One&family=New+Rocker&family=Cinzel:wght@600&display=swap" />
<style>
:root {
  --navy:#1e3a5f;
  --wood:#6a3e22; --wood-lit:#9a6240; --wood-ink:#3d2214;
  --moss:#14301f; --moss-lit:#1d4630;
  --leaf:#c45a1a; --leaf-lit:#d9782e; --leaf-dim:#8a3d12;
  --plaque:#f6e4b8;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --tavern:"Pirata One","New Rocker",Georgia,serif;
  --dock:"Cinzel","New Rocker",Georgia,serif;
  --ink-line:#2a140a;
  --bog:radial-gradient(ellipse at 50% 85%,#3d7a52 0%,#1d4630 38%,#0c1c14 78%,#2a140a 100%);
  --harbor:
    radial-gradient(circle at 10px 8px,#2a140a 1.4px,transparent 1.8px),
    radial-gradient(circle at calc(100% - 10px) 8px,#2a140a 1.4px,transparent 1.8px),
    radial-gradient(circle at 10px calc(100% - 8px),#2a140a 1.4px,transparent 1.8px),
    radial-gradient(circle at calc(100% - 10px) calc(100% - 8px),#2a140a 1.4px,transparent 1.8px),
    linear-gradient(180deg,rgba(246,228,184,.16),rgba(20,10,4,.08) 28%,rgba(20,48,31,.18) 62%,rgba(18,8,4,.38)),
    repeating-linear-gradient(90deg,rgba(18,8,4,.22) 0 1px,transparent 1px 27px),
    repeating-linear-gradient(180deg,#6e4224 0 10px,#3a1f0e 10px 12px,#8a5530 12px 21px,#2a140a 21px 23px,#7a4a28 23px 32px,#4a2812 32px 34px);
  --sign-edge:inset 0 0 0 2px #8b5530, inset 0 0 0 5px #2a140a, 0 8px 0 #1a0c06, 0 14px 18px rgba(10,4,0,.45);
  --letter:
    -2px -2px 0 #2a140a,
     2px -2px 0 #2a140a,
    -2px  2px 0 #2a140a,
     2px  2px 0 #2a140a,
    -3px  0 0 #2a140a,
     3px  0 0 #2a140a,
     0 -3px 0 #2a140a,
     0  3px 0 #2a140a,
     0  4px 0 #1a0c06,
     3px 7px 0 #3d2214,
     5px 12px 10px rgba(10,4,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;border-radius:0 !important}
html,body{
  margin:0;background:var(--navy);color:var(--plaque);
  font-family:ui-monospace,Menlo,"SF Mono",Consolas,monospace;
  overflow:hidden;
  height:100%;height:100vh;height:100svh;height:100dvh;
}
@supports (-webkit-touch-callout: none){
  html,body,#app{height:-webkit-fill-available;}
}
button{cursor:pointer;font:inherit;color:inherit;background:none}
img,svg,.mark img,.brandshot,.shot,.example-shot{image-rendering:auto}
#dither{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;image-rendering:pixelated}
#app{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:transparent;height:100%;height:100vh;height:100svh;height:100dvh}
header.top, nav.dock{position:relative;z-index:3}
header.top{background:var(--harbor);color:var(--plaque);border-bottom:7px solid #2a140a;box-shadow:inset 0 1px 0 rgba(246,228,184,.2), inset 0 -10px 18px rgba(18,8,4,.4);padding:calc(8px + var(--safe-t)) 12px 10px}
.barrow{display:flex;align-items:center;gap:10px;min-height:40px}
.mark{width:36px;height:36px;flex:0 0 auto;background:var(--harbor);overflow:hidden;border:3px solid #2a140a;box-shadow:inset 0 0 0 1px #8b5530;font-family:var(--tavern);font-size:22px;line-height:30px;text-align:center;color:var(--plaque);-webkit-text-stroke:1.4px #2a140a;paint-order:stroke fill;text-shadow:var(--letter)}
.mark img{width:100%;height:100%;object-fit:cover;display:block}
.brand{flex:1;min-width:0;color:var(--plaque);padding:4px 8px 3px;background:var(--harbor);border:3px solid #2a140a;box-shadow:var(--sign-edge)}
.brand h1{margin:0;font-family:var(--tavern);font-size:28px;font-weight:400;letter-spacing:.1em;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;color:#f8e7bc;-webkit-text-stroke:2px #2a140a;paint-order:stroke fill;text-shadow:var(--letter)}
.brand p{margin:4px 0 0;font-family:var(--dock);font-size:8px;line-height:1.3;font-weight:600;opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 1px 0 #1a0c06}
.iconbtn{flex:0 0 auto;width:36px;height:36px;border:3px solid #2a140a;background:var(--harbor);color:var(--plaque);display:grid;place-items:center;box-shadow:inset 0 0 0 1px #8b5530;transition:transform .08s ease, box-shadow .12s ease, background .12s ease}
.iconbtn svg{width:18px;height:18px}
nav.pills,.lang{display:none}
.ticket.passed{opacity:.42}
button:focus-visible,a:focus-visible{outline:2px solid var(--leaf-lit);outline-offset:2px}
.pager{position:relative;z-index:2;min-width:0;min-height:0;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;width:100%;min-width:100%;max-width:100%;height:100%;max-height:100%;min-height:0;overflow-x:hidden;overflow-y:auto;scroll-snap-align:start;scroll-snap-stop:always;padding:16px 12px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:transparent}
nav.dock{display:flex;justify-content:center;align-items:stretch;gap:0;background:var(--harbor);color:var(--plaque);border-top:7px solid #2a140a;padding:6px 8px calc(10px + var(--safe-b));position:sticky;bottom:0;box-shadow:inset 0 8px 16px rgba(18,8,4,.35)}
nav.dock button{flex:1 1 0;max-width:84px;border:3px solid transparent;background:none;color:var(--plaque);opacity:.55;font-family:var(--dock);font-size:10px;font-weight:600;letter-spacing:.12em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;text-transform:uppercase;white-space:nowrap;text-align:center;transition:transform .08s ease, box-shadow .12s ease, background .12s ease, opacity .12s ease}
nav.dock button.on{opacity:1;background:rgba(42,20,10,.55);border-color:#2a140a;box-shadow:inset 0 0 0 1px #8b5530}
nav.dock svg{width:18px;height:18px}
h2{position:relative;isolation:isolate;margin:0 0 12px;padding:16px 14px;font-family:var(--tavern);font-size:28px;font-weight:400;letter-spacing:.08em;line-height:1.15;text-transform:uppercase;color:#f8e7bc;background:var(--harbor);border:8px solid #2a140a;box-shadow:var(--sign-edge);-webkit-text-stroke:2px #2a140a;paint-order:stroke fill;text-shadow:var(--letter)}
h2::before{content:"";position:absolute;inset:6px;z-index:-1;pointer-events:none;border:1px dashed rgba(246,228,184,.28)}
h3{margin:0;font-family:var(--dock);font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--plaque)}
.kicker{display:inline-block;margin:0 0 8px;padding:4px 8px;font-family:var(--dock);font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--plaque);background:var(--harbor);border:4px solid #2a140a;box-shadow:inset 0 0 0 1px #8b5530,3px 3px 0 #1a0c06}
.card .kicker,.ticket .kicker,.sheet .kicker{display:block;margin:0 0 6px;padding:0;color:var(--plaque);background:transparent;border:0;box-shadow:none;opacity:.8}
.muted{color:var(--plaque);font-size:12px;line-height:1.45;text-shadow:0 1px 0 #0b1a2e}
.note{color:var(--plaque);font-size:11px;line-height:1.4;margin-top:3px;opacity:.8}
.hint{margin:0 14px 10px;font-size:11px;line-height:1.4;opacity:.75}
.stack{display:flex;flex-direction:column;gap:10px}
.card,.ticket,.banner,.sheet{color:var(--plaque);background:linear-gradient(180deg,var(--moss-lit),var(--moss));border:5px solid var(--wood);box-shadow:inset 0 0 0 1px var(--wood-lit),3px 3px 0 var(--wood-ink);overflow:hidden}
.pad{padding:14px 14px}
.row{display:flex;gap:10px;align-items:flex-start;width:100%;padding:12px 14px;border:0;border-top:2px solid var(--wood);background:transparent;color:inherit;text-align:left;text-decoration:none}
.card>.row:first-of-type{border-top:0}
.when{width:4.8rem;flex-shrink:0}
.when b{display:block;font-variant-numeric:tabular-nums;font-size:13px}
.when span{font-size:10px;font-weight:600}
.check{width:16px;height:16px;border:2px solid var(--plaque);flex-shrink:0;margin-top:2px;background:transparent}
.on .check{background:var(--leaf-lit);box-shadow:inset 0 0 0 3px var(--moss)}
.on .ttl{text-decoration:line-through;opacity:.45}
.ttl{margin:0;font-size:13px;font-weight:700;text-transform:uppercase}
.act{color:var(--plaque);font-size:11px;font-weight:700;flex-shrink:0;padding:8px 0;text-decoration:none}
.btn{display:flex;align-items:center;justify-content:center;min-height:44px;width:100%;border:0;font-family:var(--dock);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;position:relative;transition:transform .08s ease, box-shadow .12s ease, background .12s ease, color .12s ease}
.btn-a{background:var(--leaf-lit);color:var(--wood-ink);border:4px solid #2a140a;box-shadow:3px 3px 0 #1a0c06}
.btn-g{background:var(--wood);color:var(--plaque);border:4px solid #2a140a;box-shadow:3px 3px 0 #1a0c06}
.btn:active,.iconbtn:active,.mapclose:active,nav.dock button:active{
  transform:translateY(3px);
  background:var(--bog);
  color:#f6e4b8;
  border-color:#2a140a;
  box-shadow:inset 0 12px 22px rgba(6,20,12,.82), inset 0 -6px 14px rgba(61,122,82,.28), inset 0 0 0 3px #2a140a, 0 1px 0 #1a0c06;
}
nav.dock button:active{opacity:1}
.field{display:flex;flex-direction:column;gap:6px;padding:0 14px 12px}
.field label{font-family:var(--dock);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--plaque)}
.field input,.field textarea,.field select{border:2px solid var(--wood);background:#0c1c14;padding:10px;font-size:16px;line-height:1.3;color:var(--plaque);font-family:inherit;width:100%;min-width:0;-webkit-appearance:none;appearance:none;color-scheme:dark}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ticket{padding:14px}
.ticket .codes{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ticket .code{font-size:24px;font-weight:750}
.ticket .city{font-size:11px;margin-top:2px}
.ticket .mid{text-align:center;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ticket .meta{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:2px dashed var(--wood)}
.ticket .meta b{display:block;font-variant-numeric:tabular-nums}
.ticket .meta span{font-size:10px;font-weight:650}
.banner{padding:12px 14px;font-size:12px}
.brandshot,.example-shot{width:100%;max-width:100%;height:auto;max-height:none;object-fit:contain;object-position:top;margin:0;border:0;display:block;background:#0c1c14;filter:none}
.example-card{flex-shrink:0}
#map{height:220px;background:#1e3a5f;touch-action:none;filter:grayscale(1) contrast(1.15) sepia(.55)}
.mapwrap{position:relative;padding:8px}
.mapclose{position:absolute;top:16px;left:16px;z-index:2;height:34px;padding:0 12px;border:3px solid #2a140a;background:var(--wood);color:var(--plaque);font-family:var(--dock);font-size:12px;font-weight:600;transition:transform .08s ease, background .12s ease, box-shadow .12s ease}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,48,31,.72);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(430px,100%);padding:16px 16px calc(18px + var(--safe-b))}
</style>
</head>
<body>
<canvas id="dither" aria-hidden="true"></canvas>
<div id="app">
  <header class="top">
    <div class="barrow">
      <div class="mark" aria-hidden="true">B</div>
      <div class="brand"><h1 id="hdrTitle">BudVia</h1><p id="hdrSub">Not all who wander are lost, especially with the right companion: Tolkien</p></div>
      <button class="iconbtn" data-act="export" type="button" aria-label="Export">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>
      </button>
    </div>
  </header>
  <div class="pager" id="pager">
    <section class="page" id="page-today"></section>
    <section class="page" id="page-plan"></section>
    <section class="page" id="page-map"></section>
    <section class="page" id="page-pack"></section>
    <section class="page" id="page-apps"></section>
  </div>
  <nav class="dock" id="dock"></nav>
</div>
<div class="overlay" id="export">
  <div class="sheet stack" id="exportSheet">
    <p class="kicker">Export</p>
    <h3>Calendar and Reminders</h3>
    <p class="muted">Writes an .ics file on this phone. Nothing is uploaded.</p>
    <button class="btn btn-a" type="button" data-act="ics-cal">Add to Calendar</button>
    <button class="btn btn-g" type="button" data-act="ics-rem">Add to Reminders</button>
    <button class="btn btn-g" type="button" data-act="export-close">Close</button>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="./icon.js?v=en5"></script>
<script src="./brand.js?v=en5"></script>
<script src="./app.js?v=en5"></script>
<script src="./i18n.js?v=en5"></script>
<script src="./tickets.js?v=en11"></script>
<script src="./scan.js?v=en1"></script>
<script src="./ui.js?v=en5"></script>
<script src="./pages.js?v=en5"></script>
<script src="./events.js?v=en5"></script>
<script>
(function(){
  const c=document.getElementById("dither"); if(!c) return;
  const N=[0x1e,0x3a,0x5f], K=[0x2a,0x4e,0x3a];
  const B=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  function paint(){
    const cell=6;
    const W=innerWidth||430, H=innerHeight||800;
    const w=Math.max(1,Math.ceil(W/cell)), h=Math.max(1,Math.ceil(H/cell));
    c.width=w; c.height=h;
    c.style.width=W+"px"; c.style.height=H+"px";
    const ctx=c.getContext("2d");
    const img=ctx.createImageData(w,h); const p=img.data;
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        const i=(y*w+x)*4;
        const n=((x*13+y*7)%17)/17;
        const t=0.78+(B[y&3][x&3]/16-0.5)*0.12;
        const col=n>t?K:N;
        p[i]=col[0]; p[i+1]=col[1]; p[i+2]=col[2]; p[i+3]=255;
      }
    }
    ctx.putImageData(img,0,0);
  }
  paint(); addEventListener("resize", paint);
})();
</script>
</body>
</html>
